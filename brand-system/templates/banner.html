<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>YouTube banner 2560x1440</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Everything important stays inside the 1546x423 safe area YouTube shows on every device. Replace Your Name, @yourhandle and the line. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 2560px; height: 1440px; background: #F7F7F5; color: #111; font-family: 'Bricolage Grotesque', sans-serif; overflow: hidden; position: relative; }
  .safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px; display: flex; align-items: center; justify-content: space-between; }
  .name { font-weight: 800; font-size: 200px; line-height: 1; letter-spacing: -0.04em; }
  mark { background: #FFD43B; color: inherit; padding: 0 0.1em; }
  .handle { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 36px; color: #6B6B6B; margin-top: 44px; }
  .right { width: 720px; }
  .line { font-weight: 500; font-size: 52px; line-height: 1.15; letter-spacing: -0.01em; }
  .tags { display: flex; gap: 14px; margin-top: 28px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 28px; padding: 8px 18px; border-radius: 8px; color: #fff; }
  .r { background: #C4501B; } .a { background: #2251D1; }
</style></head>
<body>
  <div class="safe">
    <div><div class="name"><mark>Your Name</mark></div><div class="handle">@yourhandle</div></div>
    <div class="right">
      <div class="line">One line on what you teach and who it helps.</div>
      <div class="tags"><span class="tag r">Side A</span><span class="tag a">Side B</span></div>
    </div>
  </div>
</body></html>
