<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Thumbnail 1280x720</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Edit the words in .words and the tags (side tags: brand-sheet.html; delete them if the video isn't about one side). Max 4 words, one <mark>.
     Put a frame of you from the video at assets/photo.jpg. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; background: #F7F7F5; color: #111; font-family: 'Bricolage Grotesque', sans-serif; overflow: hidden; position: relative; }
  .photo { position: absolute; right: 0; top: 0; width: 560px; height: 720px; object-fit: cover; object-position: 50% 30%; }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .words { font-weight: 800; font-size: 132px; line-height: 0.98; letter-spacing: -0.035em; }
  mark { background: #FFD43B; color: inherit; padding: 0 0.08em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .tags { display: flex; gap: 12px; }
  .tag { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 26px; padding: 8px 16px; border-radius: 8px; color: #fff; }
  .r { background: #C4501B; } .a { background: #2251D1; }
</style></head>
<body>
  <img class="photo" src="assets/photo.jpg" alt="">
  <div class="text">
    <div class="tags"><span class="tag r">Side A</span><span class="tag a">Side B</span></div>
    <div class="words">Four words, <mark>one highlight.</mark></div>
  </div>
</body></html>
